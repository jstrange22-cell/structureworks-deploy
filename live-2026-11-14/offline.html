<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico?v=202608261157" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png?v=202608261157">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/icons/favicon-16.png?v=202608261157">
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png?v=202608261157">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <title>Offline — StructureWorks</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico?v=202608261157" sizes="any">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(135deg,#0f172a,#1e293b 55%,#1e3a5f);color:#fff;text-align:center;padding:24px}
    .card{max-width:420px}
    .logo{width:84px;height:84px;border-radius:18px;background:#2563eb;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-weight:800;font-size:30px;letter-spacing:-1px}
    h1{font-size:1.5rem;margin:0 0 10px}
    p{color:rgba(255,255,255,.78);line-height:1.6;margin:0 0 24px}
    .btns{display:flex;flex-direction:column;gap:12px}
    a{display:block;padding:14px 20px;border-radius:12px;text-decoration:none;font-weight:700}
    .call{background:#16a34a;color:#fff}
    .retry{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
  </style>
  <script type="speculationrules">
  {"prefetch":[{"source":"document","where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":"/agent-*"}}]},"eagerness":"moderate"}]}
  </script>
</head>
<body>
  <main class="card">
    <div class="logo">SW</div>
    <h1>You're offline</h1>
    <p>It looks like your connection dropped. Your project still matters to us — reach the StructureWorks team directly and we'll help right away.</p>
    <div class="btns">
      <a class="call" href="tel:+18656304073">Call (865) 630-4073</a>
      <a class="retry" href="/" onclick="location.reload();return false;">Try again</a>
    </div>
  </main>
</body>
</html>
