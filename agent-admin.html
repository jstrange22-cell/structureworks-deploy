<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - AgentWorks</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo-dark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="agent.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="agent.js"></script>
  <!-- seo-meta -->
  <meta name="robots" content="noindex,nofollow">
</head>
<body>
  <header class="agent-header">
    <div class="agent-header-inner">
      <div class="agent-header-left">
        <a href="/"><img src="/img/logo-full-light.png?v=20260521" alt="StructureWorks"></a>
        <h1>AgentWorks<span>Admin</span></h1>
      </div>
      <div class="agent-header-right">
        <span class="agent-user-name" id="admin-name"></span>
        <button class="btn-signout" onclick="agentLogout()">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="agent-main">
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchTab('projects')">All Projects</button>
      <button class="admin-tab" onclick="switchTab('pending')">Pending Agents</button>
      <button class="admin-tab" onclick="switchTab('agents')">All Agents</button>
    </div>

    <div id="tab-projects"></div>
    <div id="tab-pending" style="display:none;"></div>
    <div id="tab-agents" style="display:none;"></div>
  </main>

  <script>
    let currentAdmin = null;

    requireAdmin((user, profile) => {
      currentAdmin = profile;
      document.getElementById('admin-name').textContent = profile.fullName || user.email;
      loadAllProjects();
      loadPendingAgents();
      loadAllAgents();
    });

    function switchTab(tab) {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-projects').style.display = 'none';
      document.getElementById('tab-pending').style.display = 'none';
      document.getElementById('tab-agents').style.display = 'none';

      if (tab === 'projects') {
        document.querySelectorAll('.admin-tab')[0].classList.add('active');
        document.getElementById('tab-projects').style.display = 'block';
      } else if (tab === 'pending') {
        document.querySelectorAll('.admin-tab')[1].classList.add('active');
        document.getElementById('tab-pending').style.display = 'block';
      } else {
        document.querySelectorAll('.admin-tab')[2].classList.add('active');
        document.getElementById('tab-agents').style.display = 'block';
      }
    }

    // ===== All Projects =====
    function loadAllProjects() {
      getAllProjects().then(projects => {
        let html = `<div class="projects-section">
          <div class="projects-header">
            <h2>All Projects (${projects.length})</h2>
          </div>`;

        if (projects.length === 0) {
          html += `<div class="no-projects"><p>No projects submitted yet.</p></div>`;
        } else {
          html += `<table class="projects-table">
            <thead><tr>
              <th>Property</th>
              <th>Agent</th>
              <th>Client</th>
              <th>Status</th>
              <th>Urgency</th>
              <th>Close Date</th>
            </tr></thead><tbody>`;

          projects.forEach((p, i) => {
            html += `<tr onclick="toggleAdminDetail(${i})" style="cursor:pointer;">
              <td class="address">${p.propertyAddress || '--'}</td>
              <td>${p.agentName || '--'}</td>
              <td>${p.clientName || '--'}</td>
              <td>
                <select class="status-select" onchange="changeStatus('${p.id}', this.value, event)" onclick="event.stopPropagation();">
                  <option value="submitted" ${p.status === 'submitted' ? 'selected' : ''}>Submitted</option>
                  <option value="reviewing" ${p.status === 'reviewing' ? 'selected' : ''}>Reviewing</option>
                  <option value="approved" ${p.status === 'approved' ? 'selected' : ''}>Approved</option>
                  <option value="in_progress" ${p.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                  <option value="completed" ${p.status === 'completed' ? 'selected' : ''}>Completed</option>
                  <option value="cancelled" ${p.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                </select>
              </td>
              <td>${p.urgency || 'standard'}</td>
              <td>${p.targetCloseDate || '--'}</td>
            </tr>
            <tr><td colspan="6" style="padding:0;">
              <div class="project-detail" id="admin-detail-${i}">
                <div class="detail-grid">
                  <div class="detail-item"><label>Full Address</label><span>${p.propertyAddress || ''}, ${p.city || 'Knoxville'}, ${p.state || 'TN'} ${p.zipCode || ''}</span></div>
                  <div class="detail-item"><label>Project Type</label><span>${(p.projectType || '').replace(/_/g, ' ')}</span></div>
                  <div class="detail-item"><label>Budget</label><span>${p.estimatedBudget || '--'}</span></div>
                  <div class="detail-item"><label>Agent Email</label><span>${p.agentEmail || '--'}</span></div>
                  <div class="detail-item"><label>Client Phone</label><span>${p.clientPhone || '--'}</span></div>
                  <div class="detail-item"><label>Client Email</label><span>${p.clientEmail || '--'}</span></div>
                </div>
                <div class="detail-description">
                  <label>Description</label>
                  <p>${p.description || 'No description.'}</p>
                </div>
                <div class="detail-description">
                  <label>Admin Notes</label>
                  <textarea class="admin-notes" id="notes-${p.id}" placeholder="Add internal notes...">${p.notes || ''}</textarea>
                  <button class="btn btn-primary" style="margin-top:8px; padding:8px 20px; font-size:0.85rem;" onclick="saveNotes('${p.id}', event)">Save Notes</button>
                </div>
              </div>
            </td></tr>`;
          });
          html += `</tbody></table>`;
        }
        html += `</div>`;
        document.getElementById('tab-projects').innerHTML = html;
      });
    }

    function toggleAdminDetail(i) {
      const el = document.getElementById('admin-detail-' + i);
      el.classList.toggle('open');
    }

    function changeStatus(projectId, newStatus, event) {
      event.stopPropagation();
      const name = currentAdmin ? (currentAdmin.fullName || 'Admin') : 'Admin';
      updateProjectStatus(projectId, newStatus, name, '')
        .then(() => showToast('Status updated to ' + newStatus.replace(/_/g, ' ')))
        .catch(err => showToast(err.message, 'error'));
    }

    function saveNotes(projectId, event) {
      event.stopPropagation();
      const notes = document.getElementById('notes-' + projectId).value;
      updateProjectNotes(projectId, notes)
        .then(() => showToast('Notes saved'))
        .catch(err => showToast(err.message, 'error'));
    }

    // ===== Pending Agents =====
    function loadPendingAgents() {
      getPendingAgents().then(agents => {
        let html = `<h2 style="font-size:1.1rem; margin-bottom:16px;">Pending Approval (${agents.length})</h2>`;
        if (agents.length === 0) {
          html += `<div class="no-projects"><p>No pending agent approvals.</p></div>`;
        } else {
          html += `<div class="agent-list">`;
          agents.forEach(a => {
            html += `<div class="agent-item" id="agent-${a.id}">
              <div class="agent-info">
                <h4>${a.fullName}</h4>
                <p>${a.email} &middot; ${a.company || 'No company'} &middot; License: ${a.licenseNumber || 'N/A'}</p>
              </div>
              <div class="agent-actions">
                <button class="btn-approve" onclick="handleApprove('${a.id}')">Approve</button>
                <button class="btn-reject" onclick="handleReject('${a.id}')">Reject</button>
              </div>
            </div>`;
          });
          html += `</div>`;
        }
        document.getElementById('tab-pending').innerHTML = html;
      });
    }

    function handleApprove(uid) {
      approveAgent(uid).then(() => {
        showToast('Agent approved!');
        document.getElementById('agent-' + uid).remove();
        loadPendingAgents();
        loadAllAgents();
      }).catch(err => showToast(err.message, 'error'));
    }

    function handleReject(uid) {
      if (!confirm('Are you sure you want to reject this agent? This will delete their account.')) return;
      rejectAgent(uid).then(() => {
        showToast('Agent rejected');
        document.getElementById('agent-' + uid).remove();
        loadPendingAgents();
      }).catch(err => showToast(err.message, 'error'));
    }

    // ===== All Agents =====
    function loadAllAgents() {
      getAllAgents().then(agents => {
        let html = `<h2 style="font-size:1.1rem; margin-bottom:16px;">Registered Agents (${agents.length})</h2>`;
        if (agents.length === 0) {
          html += `<div class="no-projects"><p>No registered agents yet.</p></div>`;
        } else {
          html += `<div class="agent-list">`;
          agents.forEach(a => {
            const status = a.isApproved ?
              '<span style="color:#16a34a; font-weight:600;">Approved</span>' :
              '<span style="color:#f59e0b; font-weight:600;">Pending</span>';
            html += `<div class="agent-item">
              <div class="agent-info">
                <h4>${a.fullName} ${status}</h4>
                <p>${a.email} &middot; ${a.company || 'No company'} &middot; ${a.phone || 'No phone'}</p>
              </div>
            </div>`;
          });
          html += `</div>`;
        }
        document.getElementById('tab-agents').innerHTML = html;
      });
    }
  </script>
</body>
</html>
