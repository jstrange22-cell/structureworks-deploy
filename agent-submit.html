<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Job - AgentWorks</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo-dark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css?v=20260523">
  <link rel="stylesheet" href="agent.css?v=20260523">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="agent.js?v=20260523"></script>
  <meta name="robots" content="noindex,nofollow">
</head>
<body>
  <header class="agent-header">
    <div class="agent-header-inner">
      <div class="agent-header-left">
        <a href="/"><img src="/img/logo-full-light.png?v=20260523" alt="StructureWorks"></a>
        <h1>AgentWorks<span>Submit Job</span></h1>
      </div>
      <div class="agent-header-right">
        <a href="/agent-dashboard" class="btn-signout" style="margin-right:8px;">Back to Dashboard</a>
        <button class="btn-signout" onclick="agentLogout()">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="agent-main">
    <div class="contact-form-wrapper" style="max-width:720px; margin:0 auto;">
      <h3 style="font-size:1.4rem; margin-bottom:8px;">Submit a New Job</h3>
      <p style="color:#64748b; margin-bottom:24px; font-size:0.95rem;">Add the property + client details and attach photos and the inspection report. Our team reviews and follows up — you can track status on your dashboard.</p>

      <form class="contact-form" id="submit-form" onsubmit="handleProjectSubmit(event)">
        <div class="form-group">
          <label for="address">Property Address *</label>
          <input type="text" id="address" placeholder="Full street address" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" value="Knoxville" placeholder="City">
          </div>
          <div class="form-group">
            <label for="state">State</label>
            <input type="text" id="state" value="TN" placeholder="State" maxlength="2">
          </div>
          <div class="form-group">
            <label for="zip">ZIP</label>
            <input type="text" id="zip" placeholder="37919" maxlength="10">
          </div>
        </div>

        <div style="border-top:1px solid #e2e8f0; margin:8px 0 16px;"></div>

        <div class="form-row">
          <div class="form-group">
            <label for="client-name">Client Name *</label>
            <input type="text" id="client-name" placeholder="Homeowner/buyer name" required>
          </div>
          <div class="form-group">
            <label for="client-phone">Client Phone</label>
            <input type="tel" id="client-phone" placeholder="(865) 555-0000">
          </div>
        </div>
        <div class="form-group">
          <label for="client-email">Client Email</label>
          <input type="email" id="client-email" placeholder="client@example.com">
        </div>

        <div style="border-top:1px solid #e2e8f0; margin:8px 0 16px;"></div>

        <div class="form-row">
          <div class="form-group">
            <label for="project-type">Job Type *</label>
            <select id="project-type" required>
              <option value="Inspection Repair">Inspection Repair</option>
              <option value="Roofing">Roofing</option>
              <option value="Deck / Exterior">Deck / Exterior</option>
              <option value="Renovation">Renovation</option>
              <option value="Maintenance">Maintenance</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="urgency">Urgency</label>
            <select id="urgency">
              <option value="standard">Standard</option>
              <option value="rush">Rush</option>
              <option value="emergency">Emergency</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="close-date">Target Close Date</label>
            <input type="date" id="close-date">
          </div>
          <div class="form-group">
            <label for="budget">Estimated Budget</label>
            <select id="budget">
              <option value="">Select range</option>
              <option value="Under $1,000">Under $1,000</option>
              <option value="$1,000 - $5,000">$1,000 - $5,000</option>
              <option value="$5,000 - $15,000">$5,000 - $15,000</option>
              <option value="$15,000 - $30,000">$15,000 - $30,000</option>
              <option value="$30,000+">$30,000+</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="description">Job Description *</label>
          <textarea id="description" rows="5" placeholder="Describe the work needed, inspection findings, timeline requirements, and any other details..." required></textarea>
        </div>

        <div style="border-top:1px solid #e2e8f0; margin:8px 0 16px;"></div>

        <div class="form-group">
          <label for="photos">Photos <span style="font-weight:400; color:#94a3b8;">(inspection findings, damage, the area)</span></label>
          <input type="file" id="photos" accept="image/*" multiple>
          <p class="upload-hint">JPG/PNG — up to 30 photos.</p>
        </div>
        <div class="form-group">
          <label for="pdfs">Inspection Report / Documents <span style="font-weight:400; color:#94a3b8;">(PDF)</span></label>
          <input type="file" id="pdfs" accept="application/pdf" multiple>
          <p class="upload-hint">PDF only — up to 10 files, 25&nbsp;MB each.</p>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-full" id="submit-btn">Submit Job</button>
        <p class="form-note" id="submit-note"></p>
      </form>
    </div>
  </main>

  <script>
    requireAuth((user, profile) => {
      // Any signed-in agent can submit (auto-approved). Profile is ensured by requireAuth.
    });

    async function handleProjectSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const note = document.getElementById('submit-note');
      const original = btn.textContent;

      const photos = Array.from(document.getElementById('photos').files || []);
      const pdfs = Array.from(document.getElementById('pdfs').files || []);
      const files = [...photos, ...pdfs];

      for (const f of files) {
        if (f.size > 25 * 1024 * 1024) {
          showToast(`${f.name} is too large (max 25MB).`, 'error');
          return;
        }
      }

      let details = document.getElementById('description').value;
      const close = document.getElementById('close-date').value;
      const budget = document.getElementById('budget').value;
      if (close) details += `\nTarget close date: ${close}`;
      if (budget) details += `\nEstimated budget: ${budget}`;

      const job = {
        propertyAddress: document.getElementById('address').value,
        city: document.getElementById('city').value,
        state: document.getElementById('state').value,
        zip: document.getElementById('zip').value,
        clientName: document.getElementById('client-name').value,
        clientPhone: document.getElementById('client-phone').value,
        clientEmail: document.getElementById('client-email').value,
        projectType: document.getElementById('project-type').value,
        urgency: document.getElementById('urgency').value,
        description: details,
      };

      btn.disabled = true;
      btn.textContent = files.length ? `Uploading ${files.length} file(s)...` : 'Submitting...';
      note.textContent = '';

      try {
        await submitAgentJob(job, files);
        btn.textContent = 'Job Submitted!';
        btn.style.background = '#16a34a';
        btn.style.borderColor = '#16a34a';
        showToast('Job submitted! Our team will review and follow up.');
        setTimeout(() => { window.location.href = '/agent-dashboard'; }, 1500);
      } catch (err) {
        showToast(err.message || 'Submission failed. Please try again.', 'error');
        note.textContent = err.message || '';
        note.style.color = '#dc2626';
        btn.disabled = false;
        btn.textContent = original;
      }
    }
  </script>
</body>
</html>
