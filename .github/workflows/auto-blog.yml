name: Auto Blog (2x/week)

# Generates one SEO-optimized East-TN construction blog post, commits it, and
# deploys the site via FTP. Runs Tuesday & Friday, and can be run on demand.

on:
  schedule:
    - cron: '0 13 * * 2,5'   # Tue & Fri 13:00 UTC (~9am ET)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: python scripts/generate_blog.py

      - name: Commit generated files
        run: |
          git config user.name "structureworks-bot"
          git config user.email "bot@structureworkstn.com"
          git add blog.html sitemap.xml blog/ scripts/blog_topics_used.json
          git commit -m "chore(blog): auto-generated post $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git push

      - name: Deploy via FTP
        env:
          SW_FTP_HOST: ${{ secrets.SW_FTP_HOST }}
          SW_FTP_USER: ${{ secrets.SW_FTP_USER }}
          SW_FTP_PASS: ${{ secrets.SW_FTP_PASS }}
          SW_FTP_PORT: ${{ secrets.SW_FTP_PORT }}
          SW_FTP_REMOTE_ROOT: ${{ secrets.SW_FTP_REMOTE_ROOT }}
        run: python deploy_ftp.py
